<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>doxer — face match index</title>
<style>
  :root {
    --bg: #0e1013;
    --panel: #15181d;
    --panel2: #1a1e24;
    --line: #262b33;
    --text: #e8ebf0;
    --dim: #8b93a1;
    --accent: #6ea8fe;
    --good: #4ade80;
    --mid: #fbbf24;
    --low: #f87171;
  }
  * { box-sizing: border-box; }
  body {
    margin: 0; background: var(--bg); color: var(--text);
    font: 14px/1.5 -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
  }
  a { color: var(--accent); text-decoration: none; }
  header {
    display: flex; align-items: center; gap: 16px;
    padding: 14px 22px; border-bottom: 1px solid var(--line);
    position: sticky; top: 0; background: rgba(14,16,19,.92); backdrop-filter: blur(8px); z-index: 5;
  }
  .logo { font-size: 18px; font-weight: 700; letter-spacing: .3px; }
  .logo span { color: var(--accent); }
  .stats { margin-left: auto; color: var(--dim); font-size: 12.5px; display: flex; gap: 14px; }
  .stats b { color: var(--text); font-weight: 600; }
  main { display: grid; grid-template-columns: 380px 1fr; gap: 20px; padding: 20px 22px; max-width: 1400px; margin: 0 auto; }
  @media (max-width: 900px) { main { grid-template-columns: 1fr; } }
  .card { background: var(--panel); border: 1px solid var(--line); border-radius: 12px; padding: 16px; }
  h2 { margin: 0 0 12px; font-size: 13px; text-transform: uppercase; letter-spacing: .8px; color: var(--dim); font-weight: 600; }
  label { display: block; font-size: 12.5px; color: var(--dim); margin: 10px 0 5px; }
  input[type=text], input[type=url] {
    width: 100%; background: var(--panel2); border: 1px solid var(--line); color: var(--text);
    border-radius: 8px; padding: 9px 11px; font-size: 13.5px; outline: none;
  }
  input:focus { border-color: var(--accent); }
  button {
    background: var(--accent); border: 0; color: #0b1220; font-weight: 600; font-size: 13.5px;
    border-radius: 8px; padding: 9px 14px; cursor: pointer;
  }
  button:hover { filter: brightness(1.1); }
  button:disabled { opacity: .5; cursor: default; }
  button.ghost { background: transparent; color: var(--dim); border: 1px solid var(--line); font-weight: 500; }
  button.danger { background: transparent; color: var(--low); border: 1px solid var(--line); padding: 4px 9px; font-size: 12px; }
  .row { display: flex; gap: 8px; align-items: center; }
  .job { font-size: 12.5px; color: var(--dim); margin-top: 8px; display: flex; gap: 8px; align-items: center; }
  .spin { width: 12px; height: 12px; border: 2px solid var(--line); border-top-color: var(--accent); border-radius: 50%; animation: sp 1s linear infinite; flex: none; }
  @keyframes sp { to { transform: rotate(360deg); } }
  .profile { display: flex; gap: 10px; align-items: center; padding: 9px 0; border-top: 1px solid var(--line); }
  .profile:first-of-type { border-top: 0; }
  .avatar { width: 38px; height: 38px; border-radius: 50%; object-fit: cover; background: var(--panel2); flex: none; border: 1px solid var(--line); }
  .pinfo { min-width: 0; flex: 1; }
  .pname { font-weight: 600; font-size: 13.5px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .pmeta { color: var(--dim); font-size: 12px; }
  .badge { display: inline-block; font-size: 10.5px; padding: 1px 7px; border-radius: 99px; border: 1px solid var(--line); color: var(--dim); margin-right: 6px; vertical-align: 1px; }
  .badge.instagram { color: #e1306c; } .badge.facebook { color: #4267B2; filter: brightness(1.5); } .badge.threads { color: var(--text); }
  .drop {
    border: 1.5px dashed var(--line); border-radius: 12px; padding: 26px; text-align: center;
    color: var(--dim); cursor: pointer; transition: border-color .15s, background .15s;
  }
  .drop:hover, .drop.over { border-color: var(--accent); background: rgba(110,168,254,.05); color: var(--text); }
  .drop b { color: var(--text); }
  .querythumbs { display: flex; gap: 8px; margin-top: 12px; flex-wrap: wrap; }
  .querythumbs img { width: 74px; height: 74px; object-fit: cover; border-radius: 10px; border: 1px solid var(--line); }
  .results { display: grid; grid-template-columns: repeat(auto-fill, minmax(230px, 1fr)); gap: 14px; margin-top: 16px; }
  .mcard { background: var(--panel2); border: 1px solid var(--line); border-radius: 12px; overflow: hidden; display: flex; flex-direction: column; }
  .mface { width: 100%; aspect-ratio: 1; object-fit: cover; display: block; background: #0a0c0f; }
  .mbody { padding: 11px 12px 13px; }
  .mscore-row { display: flex; justify-content: space-between; align-items: baseline; margin-bottom: 6px; }
  .mscore { font-size: 19px; font-weight: 700; }
  .mlabel { font-size: 11px; padding: 2px 8px; border-radius: 99px; font-weight: 600; }
  .strong { color: var(--good); } .strong .mlabel, .mlabel.strong { background: rgba(74,222,128,.12); color: var(--good); }
  .possible .mscore { color: var(--mid); } .mlabel.possible { background: rgba(251,191,36,.12); color: var(--mid); }
  .weak .mscore { color: var(--low); } .mlabel.weak { background: rgba(248,113,113,.12); color: var(--low); }
  .bar { height: 4px; background: var(--line); border-radius: 99px; overflow: hidden; margin-bottom: 9px; }
  .bar i { display: block; height: 100%; border-radius: 99px; }
  .mname { font-weight: 600; font-size: 13.5px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .msrc { color: var(--dim); font-size: 11.5px; margin-top: 2px; display: flex; justify-content: space-between; gap: 8px; }
  .empty { color: var(--dim); padding: 30px 0; text-align: center; }
  .hint { font-size: 12px; color: var(--dim); margin-top: 10px; }
  .err { color: var(--low); font-size: 13px; margin-top: 8px; }
</style>
</head>
<body>
<header>
  <div class="logo">dox<span>er</span></div>
  <div class="stats" id="stats"></div>
</header>
<main>
  <section>
    <div class="card">
      <h2>Add profile to index</h2>
      <input type="url" id="addurl" placeholder="https://www.instagram.com/username/" spellcheck="false">
      <div style="margin-top:10px" class="row">
        <button id="addbtn" onclick="addProfile()">Scrape &amp; index</button>
        <span class="hint" style="margin:0">instagram · threads · facebook · direct image URL</span>
      </div>
      <div id="jobs"></div>
    </div>

    <div class="card" style="margin-top:16px">
      <h2>Indexed profiles</h2>
      <div id="profiles"><div class="empty">nothing indexed yet</div></div>
    </div>
  </section>

  <section>
    <div class="card">
      <h2>Search by face</h2>
      <div class="drop" id="drop">
        <b>Drop a photo here</b> or click to choose<br>
        <span style="font-size:12px">a person's photo — doxer compares every face in it against the index</span>
        <input type="file" id="file" accept="image/*" hidden>
      </div>
      <div class="row" style="margin-top:10px">
        <input type="url" id="imgurl" placeholder="…or paste an image URL and press Enter" style="flex:1" spellcheck="false">
        <button class="ghost" onclick="searchUrl()">Use URL</button>
      </div>
      <div id="qstatus"></div>
      <div class="querythumbs" id="querythumbs"></div>
    </div>

    <div id="results"></div>
  </section>
</main>

<script>
const $ = s => document.querySelector(s);
const drop = $('#drop'), fileInput = $('#file');

async function api(path, opts) {
  const r = await fetch(path, opts);
  if (!r.ok) throw new Error((await r.json().catch(()=>({}))).detail || r.statusText);
  return r.json();
}

function band(s) { return s >= .6 ? 'strong' : (s >= .45 ? 'possible' : 'weak'); }
function label(s) { return s >= .6 ? 'STRONG MATCH' : (s >= .45 ? 'POSSIBLE' : 'WEAK'); }

async function refresh() {
  const [stats, profiles] = await Promise.all([api('/api/stats'), api('/api/profiles')]);
  $('#stats').innerHTML = `<span><b>${stats.profiles}</b> profiles</span><span><b>${stats.images}</b> images</span><span><b>${stats.faces}</b> faces indexed</span>`;
  const el = $('#profiles');
  if (!profiles.length) { el.innerHTML = '<div class="empty">nothing indexed yet</div>'; return; }
  el.innerHTML = profiles.map(p => `
    <div class="profile">
      ${p.avatar_path ? `<img class="avatar" src="/img/${p.avatar_path}" alt="">` : '<div class="avatar"></div>'}
      <div class="pinfo">
        <div class="pname"><span class="badge ${p.platform}">${p.platform}</span>${esc(p.display_name || '@' + p.username)}</div>
        <div class="pmeta">${p.n_images} images · ${p.n_faces} faces</div>
      </div>
      <button class="danger" onclick="delProfile('${p.id}')">remove</button>
    </div>`).join('');
}

function esc(s) { const d = document.createElement('div'); d.textContent = s; return d.innerHTML; }

async function addProfile() {
  const url = $('#addurl').value.trim();
  if (!url) return;
  const btn = $('#addbtn'); btn.disabled = true;
  try {
    const { job } = await api('/api/profiles', { method: 'POST', headers: {'Content-Type':'application/json'}, body: JSON.stringify({ url }) });
    pollJob(job);
  } catch (e) { $('#jobs').innerHTML = `<div class="err">${esc(e.message)}</div>`; btn.disabled = false; }
}

function pollJob(jid) {
  const div = document.createElement('div');
  div.className = 'job'; div.innerHTML = '<div class="spin"></div><span>scraping…</span>';
  $('#jobs').prepend(div);
  const tick = async () => {
    let j; try { j = await api('/api/jobs/' + jid); } catch { return; }
    if (j.status === 'running') { div.querySelector('span').textContent = 'scraping & indexing…'; setTimeout(tick, 1500); return; }
    div.innerHTML = `<span style="color:${j.status==='done'?'var(--good)':'var(--low)'}">●</span><span>${esc(j.message || j.status)}</span>`;
    $('#addbtn').disabled = false;
    if (j.status === 'done') { $('#addurl').value = ''; refresh(); }
  };
  setTimeout(tick, 1200);
}

async function delProfile(pid) {
  if (!confirm('Remove this profile and all its indexed faces?')) return;
  await api('/api/profiles/' + pid, { method: 'DELETE' });
  refresh();
}

function handleFile(file) {
  if (!file || !file.type.startsWith('image/')) return;
  const fd = new FormData(); fd.append('file', file);
  runSearch(fd, URL.createObjectURL(file));
}

async function searchUrl() {
  const u = $('#imgurl').value.trim();
  if (!u) return;
  $('#qstatus').innerHTML = '<div class="job"><div class="spin"></div><span>fetching image…</span></div>';
  try {
    const r = await fetch(u, { mode: 'no-cors' });
    const blob = await r.blob();
    if (!blob.type.startsWith('image/')) throw new Error('URL did not return an image');
    const fd = new FormData(); fd.append('file', new File([blob], 'query.' + (blob.type.includes('png') ? 'png' : 'jpg')));
    runSearch(fd, u);
  } catch (e) { $('#qstatus').innerHTML = `<div class="err">${esc(e.message)}</div>`; }
}

async function runSearch(fd, previewUrl) {
  $('#qstatus').innerHTML = '<div class="job"><div class="spin"></div><span>detecting faces & matching…</span></div>';
  $('#results').innerHTML = '';
  try {
    const res = await api('/api/search', { method: 'POST', body: fd });
    renderQuery(res, previewUrl);
    renderResults(res);
  } catch (e) { $('#qstatus').innerHTML = `<div class="err">${esc(e.message)}</div>`; }
}

function renderQuery(res, previewUrl) {
  const qt = $('#querythumbs');
  if (res.query_faces && res.query_faces.length) {
    qt.innerHTML = res.query_faces.map(f => f.thumb_b64 ? `<img src="data:image/jpeg;base64,${f.thumb_b64}" alt="face">` : '').join('');
    $('#qstatus').innerHTML = `<div class="job"><span style="color:var(--good)">●</span><span>${res.query_faces.length} face(s) found in your photo</span></div>`;
  } else {
    if (previewUrl) qt.innerHTML = `<img src="${previewUrl}" alt="query">`;
    $('#qstatus').innerHTML = '<div class="err">no faces detected in that image — try a clearer, front-facing photo</div>';
  }
}

function renderResults(res) {
  const el = $('#results');
  if (!res.matches || !res.matches.length) {
    el.innerHTML = '<div class="card"><div class="empty">no matches above the 0.35 similarity floor — add more profiles or try a clearer photo</div></div>';
    return;
  }
  el.innerHTML = `<h2 style="margin:18px 4px 4px;color:var(--dim);font-size:13px;text-transform:uppercase;letter-spacing:.8px">Matches — ${res.matches.length}</h2>
  <div class="results">${res.matches.map(m => {
    const b = band(m.score), pct = Math.round(m.score * 100);
    const color = b === 'strong' ? 'var(--good)' : (b === 'possible' ? 'var(--mid)' : 'var(--low)');
    return `<div class="mcard ${b}">
      ${m.face_thumb ? `<img class="mface" src="/img/${m.face_thumb}" alt="matched face">` : '<div class="mface"></div>'}
      <div class="mbody">
        <div class="mscore-row"><span class="mscore">${pct}%</span><span class="mlabel ${b}">${label(m.score)}</span></div>
        <div class="bar"><i style="width:${pct}%;background:${color}"></i></div>
        <div class="mname"><span class="badge ${m.platform}">${m.platform}</span>${esc(m.display_name || '@' + m.username)}</div>
        <div class="msrc"><a href="${esc(m.source_url)}" target="_blank" rel="noopener">profile ↗</a><a href="${esc(m.image_url)}" target="_blank" rel="noopener">source photo ↗</a></div>
      </div>
    </div>`;
  }).join('')}</div>`;
}

drop.onclick = () => fileInput.click();
fileInput.onchange = () => handleFile(fileInput.files[0]);
['dragover','dragenter'].forEach(ev => drop.addEventListener(ev, e => { e.preventDefault(); drop.classList.add('over'); }));
['dragleave','drop'].forEach(ev => drop.addEventListener(ev, e => { e.preventDefault(); drop.classList.remove('over'); }));
drop.addEventListener('drop', e => handleFile(e.dataTransfer.files[0]));
$('#imgurl').addEventListener('keydown', e => { if (e.key === 'Enter') searchUrl(); });

refresh();
</script>
</body>
</html>
